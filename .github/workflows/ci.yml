name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # 🔴 اختبارات firestore.rules — تعمل ضد محاكي Firestore الحقيقي، لا ضد كود
  # التطبيق. Java مثبّتة مسبقاً على عدّاد ubuntu-latest (يحتاجها المحاكي).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck:rules
      - run: npm run test:rules

  # 🔴 اختبارات E2E حقيقية (Playwright) — تشغّل خادم Vite ومتصفحاً حقيقياً ضد
  # محاكيات Auth+Firestore+Functions. أبطأ جداً من بقية الوظائف (تثبيت متصفح +
  # إقلاع ثلاثة محاكيات + خادم Vite)، وهي المرشّح الأول لو احتجت لاحقاً جعل CI
  # أسرع (مثال: تشغيلها على push إلى main فقط لا كل PR).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build:
    needs: [lint, typecheck, test, rules, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # إعداد Firebase مطلوب وقت البناء (Vite يستبدل VITE_* حينها لا وقت
      # التشغيل)، وبدونه يفشل البناء برسالة "إعداد Firebase ناقص". القيم هنا
      # وهمية عمداً: البناء لا يتصل بـ Firebase إطلاقاً، وهذه الوظيفة تتحقق من
      # أن الحزمة تُبنى فقط. القيم الحقيقية في لوحة Vercel.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:ciplaceholder'
