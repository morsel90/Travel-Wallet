name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # 🔴 اختبارات firestore.rules — تعمل ضد محاكي Firestore الحقيقي، لا ضد كود
  # التطبيق. Java مثبّتة مسبقاً على عدّاد ubuntu-latest (يحتاجها المحاكي).
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck:rules
      - run: npm run test:rules

  # 🔴 اختبارات E2E حقيقية (Playwright) — تشغّل خادم Vite ومتصفحاً حقيقياً ضد
  # محاكيات Auth+Firestore+Functions. أبطأ جداً من بقية الوظائف (تثبيت متصفح +
  # إقلاع ثلاثة محاكيات + خادم Vite)، وهي المرشّح الأول لو احتجت لاحقاً جعل CI
  # أسرع (مثال: تشغيلها على push إلى main فقط لا كل PR).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./functions
      - run: npm run typecheck:e2e
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # 🆕 عند الفشل: سجلّ firebase-debug.log (يُكتب دائماً، ويحمل تفاصيل --debug
      # الكاملة لكل محاكي — بما فيها ما يُطبَع فقط بمستوى debug لا في الطرفية
      # العادية) وتقرير Playwright (لقطات شاشة + آثار عند إعادة المحاولة).
      # بدون هذه الخطوة، سبب فشل حقيقي في وقت التشغيل (لا في الاختبار نفسه)
      # يبقى سطراً واحداً غامضاً في مخرجات CI بلا أي أثر يمكن تتبّعه لاحقاً.
      - name: Upload debug logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-debug-logs
          path: |
            firebase-debug.log
            firestore-debug.log
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ⚠️ if: always() إلزامي هنا. بدونه، فشل أي وظيفة في needs يجعل GitHub
  # يُسقِط build إلى "skipping" لا "failure" — وGitHub يعامل "skipping" على
  # أنه اجتاز الفحص المطلوب في الـ ruleset، فيدمج PR رغم فشل e2e أو غيرها.
  # هذا بالضبط ما سمح بذلك فعلياً في 2026-08-16 (PR #14 دُمج رغم فشل e2e).
  # الخطوة الأولى أدناه تفشل صراحةً إن فشلت أي وظيفة في needs، فيصير لـ build
  # نتيجة حقيقية (نجاح أو فشل) دائماً — لا "skipping" مطلقاً.
  build:
    needs: [lint, typecheck, test, rules, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::One or more required jobs (lint/typecheck/test/rules/e2e) did not succeed — failing build explicitly so the branch protection gate actually blocks this merge."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      # إعداد Firebase مطلوب وقت البناء (Vite يستبدل VITE_* حينها لا وقت
      # التشغيل)، وبدونه يفشل البناء برسالة "إعداد Firebase ناقص". القيم هنا
      # وهمية عمداً: البناء لا يتصل بـ Firebase إطلاقاً، وهذه الوظيفة تتحقق من
      # أن الحزمة تُبنى فقط. القيم الحقيقية في لوحة Vercel.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          VITE_FIREBASE_APP_ID: '1:000000000000:web:ciplaceholder'
